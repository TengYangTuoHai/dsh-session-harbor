name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.7
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: refs/tags/${{ inputs.tag || github.ref_name }}

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pack the tagged version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(node -p 'require("./dsh-session-harbor/package.json").version')
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo 'The tag must match dsh-session-harbor/package.json.' >&2
            exit 1
          fi
          mkdir -p dist
          npm pack ./dsh-session-harbor --ignore-scripts --pack-destination dist
          echo "ARCHIVE=./dist/dsh-session-harbor-$version.tgz" >> "$GITHUB_ENV"
      - name: Save the release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-harbor-${{ env.RELEASE_TAG }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
      - name: Publish the archive to npm
        run: |
          version=${RELEASE_TAG#v}
          published=$(curl --fail --silent --show-error --max-time 30 https://registry.npmjs.org/dsh-session-harbor |
            jq --arg version "$version" -r '.versions[$version].dist.integrity // empty')
          if [[ -z "$published" ]]; then
            npm publish "$ARCHIVE" --access public --ignore-scripts --loglevel=verbose
          else
            integrity="sha512-$(openssl dgst -sha512 -binary "$ARCHIVE" | openssl base64 -A)"
            if [[ "$published" != "$integrity" ]]; then
              echo 'The published npm version has a different archive.' >&2
              exit 1
            fi
            echo 'The matching archive is already on npm.'
          fi
      - name: Attach the same archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if release=$(gh release view "$RELEASE_TAG" --json assets,isDraft); then
            asset=${ARCHIVE##*/}
            digest=$(jq --arg asset "$asset" -r '.assets[] | select(.name == $asset) | .digest // "unavailable"' <<< "$release")
            if [[ -z "$digest" ]]; then
              gh release upload "$RELEASE_TAG" "$ARCHIVE"
            elif [[ "$digest" != "sha256:$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)" ]]; then
              echo 'The GitHub Release already contains a different archive.' >&2
              exit 1
            fi
            if [[ $(jq -r '.isDraft' <<< "$release") == true ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" --verify-tag --generate-notes \
              --title "Session Harbor ${RELEASE_TAG#v}" \
              --notes '在 DeepSeek Harness 的「插件 → 添加插件」中输入 `dsh-session-harbor`，也可粘贴下方 `.tgz` 下载链接。'
          fi
