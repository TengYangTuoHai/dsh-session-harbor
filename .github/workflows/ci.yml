name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dsh-session-harbor/package-lock.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - run: npm --prefix dsh-session-harbor ci --ignore-scripts
      - run: pnpm --dir tools/static-check install --frozen-lockfile --ignore-scripts
      - run: node tools/build-client.mjs --check
      - run: node tools/check-client-scope.mjs
      - run: node --test tools/check-client-scope.test.mjs
      - run: npm --prefix dsh-session-harbor test
